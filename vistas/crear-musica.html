<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Canción - App de Música</title>
    <link rel="stylesheet" href="/vistas/estilos/spinner.css" />
    <link rel="stylesheet" href="../vistas/estilos/crear-cancion.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="body">
    <h1 class="titulo-principal">Gestión de Canciones</h1>
    <div class="contenedor-crear-cancion">
        <h2>Ingrese su Cancion</h2>
        <div class="campos">
            <input type="text" id="nombre-cancion" placeholder="Nombre de la Cancion" />
            <select id="genero">
                <option value="" disabled selected>Seleccione el Género de la Cancion</option>
                <option value="rock">rock</option> <!--Cambiar el segundo rock por Rock y probar si funciona igual con el back-->
                <option value="techno">techno</option>
                <option value="pop">pop</option>
                <option value="jazz">jazz</option>
                <option value="folk">folk</option>
                <option value="classical">classical</option>
            </select>
        </div>
        <button id="btnCrearcancion">Crear Canción</button>
    </div>

    <div class="contenedor-spinner">
        <div class="lds-hourglass"></div>
    </div>

    <!-- Sección para listar canciones -->
    <div class="lista-canciones">
        <h3>Lista de Canciones</h3>
        <button id="btnListarCanciones">Listar Canciones</button> 
        <table id="tabla-canciones">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Género</th>
                    <th>Autor</th>
                    <th>Acciones</th> <!-- Nueva columna -->
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se irán añadiendo las canciones dinámicamente -->
            </tbody>
        </table>
    </div>

    <script src="/controlador/crear-cancion.js"></script>
    <script src="/controlador/Listado-canciones.js"></script> <!-- Script para listar canciones -->
</body>
</html>
