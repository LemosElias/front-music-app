<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Canción - App de Música</title>
    <link rel="stylesheet" href="/vistas/estilos/spinner.css" />
    <link rel="stylesheet" href="../vistas/estilos/crear-cancion.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="body">
    <h1 class="titulo-principal">Gestión de Canciones</h1>

    <!-- Sección para crear una canción -->
    <div id="crear-cancion" class="contenedor-crear-cancion hidden">
        <h2>Ingrese su Canción</h2>
        <div class="campos">
            <input type="text" id="nombre-cancion" placeholder="Nombre de la Canción" />
            <select id="genero">
                <option value="" disabled selected>Seleccione el Género de la Canción</option>
                <option value="rock">Rock</option>
                <option value="techno">Techno</option>
                <option value="pop">Pop</option>
                <option value="jazz">Jazz</option>
                <option value="folk">Folk</option>
                <option value="classical">Classical</option>
            </select>
        </div>
        <button id="btnCrearcancion" class="contenedor-filtro" >🎵 Crear Canción</button>
    </div>

    <div class="contenedor-spinner">
        <div class="lds-hourglass"></div>
    </div>
    
    <!-- Sección para listar y filtrar canciones -->
    <div class="lista-canciones">
        <!-- Título y botones arriba -->
        <div class="boton-principal">
            <h2>Lista de Canciones</h2>
            <div class="boton-principal hidden" id="listados" >
                <button id="btnListarCanciones" class="contenedor-filtro hidden"  >Listar Todas las Canciones</button> 
                <button id="btnListarMisCanciones" class="contenedor-filtro">📂  Mis Composiciones</button>
               
            </div>
        </div>
    
        <!-- NUEVO: Flex container para filtro + tabla -->
        <div class="zona-filtro-tabla">
            <!-- Filtro -->
            <div class="contenedor-filtro">
                <h3>Filtrar Canciones</h3>
                <div class="campos">
                    <input type="text" id="filtro-artista" placeholder="Nombre del artista" />
                    <select id="filtro-genero">
                        <option value="" disabled selected>Seleccione el Género</option>
                        <option value="rock">Rock</option>
                        <option value="techno">Techno</option>
                        <option value="pop">Pop</option>
                        <option value="jazz">Jazz</option>
                        <option value="folk">Folk</option>
                        <option value="classical">Classical</option>
                    </select>
                </div>
                <button id="btnFiltrarCanciones">🔍 Filtrar Canciones</button>
            </div>
    
            <!-- Tabla -->
            <table id="tabla-canciones">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Género</th>
                        <th>Autor</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-canciones">
                    <!-- Se llenará dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>
    <div class="lista-canciones">
        <button id="btnSalir" class="contenedor-filtro">❌ Salir</button>
    </div>
   
    
    <script src="/controlador/Listado-canciones.js"></script> <!-- Primero -->
    <script src="/controlador/crear-cancion.js"></script> <!-- Segundo -->
</body>
</html>
