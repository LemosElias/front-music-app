<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - App de Música</title>
    <link rel="stylesheet" href="../estilo.css" />
    <link rel="stylesheet" href="./estilos/estilosLogin.css" />
    <script src="/controlador/login.js"></script>  <!-- Ajusta la ruta si es necesario -->

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <h1 class="retro-title">Ingresar</h1>
        <p class="subtitle">Login</p>
        <form id="registroForm">
          <div class="input-group">
            <i class="fa fa-user"></i>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ingresa tu usuario"
              required
            />
          </div>
          <div class="input-group">
            <i class="fa fa-lock"></i>
            <input
              type="password"
              id="contraseña"
              name="contraseña"
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>
          <div class="registrar">
            <h5 id="ir-a-registrar">Si no estas registrado, click aqui</h5>
          </div>

          <button id="btnIngresar">Ingresar</button>
        </form>
      </div>
    </div>
  </body>
  <script src="/controlador/login.js"></script>
</html>
