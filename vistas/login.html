<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
      <!-- Spinner -->
      <div class="contenedor-spinner" style="display:none;">
        <div class="spinner"></div>
    </div>
    <div class="login-container">
        <h2>Iniciar sesión</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="nombre">Usuario</label>
                <input type="text" id="nombre" placeholder="Ingrese su usuario" required>
            </div>
            <div class="input-group">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" id="btnIngresar">Iniciar sesión</button>
        </form>
        <div class="registrarse">
            <p>¿No tienes cuenta? <a href="./crear-usuario.html">Regístrate</a></p>
        </div>
    </div>
  
    <script src="/controlador/login.js"></script>
</body>
</html>
