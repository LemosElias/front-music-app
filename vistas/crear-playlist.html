<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Playlist - App de Música</title>
  <link rel="stylesheet" href="/vistas/estilos/spinner.css" />
  <link rel="stylesheet" href="../vistas/estilos/crear-playlist.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>

  </style>
</head>
<body class="body">
    <h1 class="titulo-principal">Gestión de Playlists</h1>
  <div class="contenedor-crear-playlist">
    <h2>Crear nueva Playlist</h2>
    <input type="text" id="nombre-playlist" placeholder="Nombre de la Playlist" />
    <button id="btnCrearPlaylist">Crear Playlist</button>
  </div>

  <div class="contenedor-spinner">
    <div class="lds-hourglass"></div>
  </div>
<!-- Botón listar playlists -->

<div class="contenedor-boton mb-4">
  <button id="btnListarPlaylists" class="boton-principal">📋 Mis Playlists</button>
 
</div>

<!-- Botón toggle -->
<div class="contenedor-boton mb-4">
  <button id="btnTogglePlaylists" class="boton-secundario">🎧 Ver Playlists</button>
</div>

 <!-- Tabla de Playlists -->
<div class="contenedor-lista-playlists" id="tabla-playlists-container" style="display: none;">
  <h2 style="text-align: center;">Listado de Playlists</h2>
  <table id="tabla-playlists">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Cantidad de Canciones</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="playlist-tbody">
      <!-- Filas dinámicas -->
    </tbody>
  </table>
</div>

<!-- Tabla de canciones de una playlist -->
<div class="contenedor-canciones-playlist" style="display: none; margin-top: 30px;">
  <h2 style="text-align: center;">Canciones de la Playlist</h2>
  <table id="tabla-canciones-playlist">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Género</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="canciones-tbody">
      <!-- Canciones se cargan dinámicamente -->
    </tbody>
  </table>
</div>

  <div class="contenedor-boton mb-4">
    <button id="btnSalir" class="boton-principal">❌ Salir</button>
  </div>


  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("btnTogglePlaylists");
      const tablaContainer = document.getElementById("tabla-playlists-container");

      let visible = false;

      toggleBtn.addEventListener("click", () => {
        visible = !visible;
        tablaContainer.style.display = visible ? "block" : "none";
        toggleBtn.textContent = visible ? "🔽 Ocultar Playlists" : "🎧 Ver Playlists";
      });
    });
  </script>

  <script src="/controlador/crear-playlist.js"></script>
  <script src="/controlador/Listado-playlists.js"></script>
</body>
</html>
